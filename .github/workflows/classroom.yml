name: Autograding Tests
on:
  - push
  - workflow_dispatch
  - repository_dispatch

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install clingo
        run: |
          python -m pip install --upgrade pip
          python -m pip install clingo==5.6.2
          # pip's clingo has no `clingo` command; add one that runs `python -m clingo`
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec %s -m clingo "$@"\n' "$(command -v python)" > "$HOME/bin/clingo"
          chmod +x "$HOME/bin/clingo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/clingo" --version

      - name: Question 0a
        id: question-0a
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Question 0a: group.txt exists'
          command: 'ls group.txt'
          timeout: '10'
          max-score: '0'

      - name: Question 0b
        id: question-0b
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Question 0b: group.txt is not empty'
          command: 'ls group.txt && [ -s group.txt ]'
          timeout: '10'
          max-score: '0'

      - name: Question 1
        id: question-1
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Question 1'
          command: 'ls group.txt && [ -s group.txt ] && python autograder.py --clingo clingo --question=1'
          timeout: '10'
          max-score: '30'

      - name: Question 2
        id: question-2
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Question 2'
          command: 'ls group.txt && [ -s group.txt ] && python autograder.py --clingo clingo --question=2'
          timeout: '10'
          max-score: '25'

      - name: Question 3
        id: question-3
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Question 3'
          command: 'ls group.txt && [ -s group.txt ] && python autograder.py --clingo clingo --question=3'
          timeout: '10'
          max-score: '25'

      - name: Question 4
        id: question-4
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: 'Question 4'
          command: 'ls group.txt && [ -s group.txt ] && python autograder.py --clingo clingo --question=4'
          timeout: '10'
          max-score: '20'

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          QUESTION-0A_RESULTS: "${{steps.question-0a.outputs.result}}"
          QUESTION-0B_RESULTS: "${{steps.question-0b.outputs.result}}"
          QUESTION-1_RESULTS: "${{steps.question-1.outputs.result}}"
          QUESTION-2_RESULTS: "${{steps.question-2.outputs.result}}"
          QUESTION-3_RESULTS: "${{steps.question-3.outputs.result}}"
          QUESTION-4_RESULTS: "${{steps.question-4.outputs.result}}"
        with:
          runners: 'question-0a,question-0b,question-1,question-2,question-3,question-4'
